name: Terraform

on:
  push:
    branches: [main]
    paths:
      - 'terraform/**'
      - 'k8s/**'
      - '.github/workflows/terraform.yml'
  pull_request:
    paths:
      - 'terraform/**'
      - 'k8s/**'
      - '.github/workflows/terraform.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate

  validate-bootstrap:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/bootstrap
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate

  kustomize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.30.0'

      - name: Build staging overlay
        run: |
          chmod +x scripts/*.sh
          make render-staging > /tmp/staging.yaml

      - name: Build production overlay
        run: kubectl kustomize k8s/overlays/production > /tmp/production.yaml

      - name: Install kubeconform
        run: |
          curl -sL "https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz" \
            | tar xz kubeconform

      - name: Validate staging manifests
        run: ./kubeconform -ignore-missing-schemas -summary -kubernetes-version 1.30.0 /tmp/staging.yaml

      - name: Validate production manifests
        run: ./kubeconform -ignore-missing-schemas -summary -kubernetes-version 1.30.0 /tmp/production.yaml
