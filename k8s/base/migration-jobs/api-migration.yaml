apiVersion: batch/v1
kind: Job
metadata:
  name: fiap-videos-api-db-migration
  labels:
    app.kubernetes.io/name: fiap-videos-api
    app.kubernetes.io/component: db-migration
spec:
  ttlSecondsAfterFinished: 86400
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fiap-videos-api
        app.kubernetes.io/component: db-migration
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: fiap-videos-api-migrator:latest
          envFrom:
            - secretRef:
                name: fiap-videos-api-secrets
          command: ['node', 'scripts/docker-migrate.js']
