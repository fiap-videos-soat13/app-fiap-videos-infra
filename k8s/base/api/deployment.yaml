apiVersion: apps/v1
kind: Deployment
metadata:
  name: fiap-videos-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fiap-videos-api
  template:
    metadata:
      labels:
        app: fiap-videos-api
    spec:
      containers:
        - name: api
          image: fiap-videos-api:latest
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: fiap-videos-api-secrets
            - configMapRef:
                name: fiap-videos-storage
            - configMapRef:
                name: fiap-videos-messaging
            - configMapRef:
                name: fiap-videos-api-runtime
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 3000
          livenessProbe:
            httpGet:
              path: /health/live
              port: 3000
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: '1'
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: fiap-videos-api
spec:
  selector:
    app: fiap-videos-api
  ports:
    - port: 80
      targetPort: 3000
