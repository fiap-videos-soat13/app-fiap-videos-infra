apiVersion: apps/v1
kind: Deployment
metadata:
  name: fiap-videos-processor
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fiap-videos-processor
  template:
    metadata:
      labels:
        app: fiap-videos-processor
    spec:
      serviceAccountName: fiap-videos-processor
      containers:
        - name: processor
          image: fiap-videos-processor:latest
          ports:
            - containerPort: 3001
          envFrom:
            - secretRef:
                name: fiap-videos-secrets
            - configMapRef:
                name: fiap-videos-storage
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: '2'
              memory: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: fiap-videos-processor
spec:
  selector:
    app: fiap-videos-processor
  ports:
    - port: 3001
      targetPort: 3001
