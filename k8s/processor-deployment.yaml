apiVersion: apps/v1
kind: Deployment
metadata:
  name: fiap-videos-processor
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fiap-videos-processor
  template:
    metadata:
      labels:
        app: fiap-videos-processor
    spec:
      containers:
        - name: processor
          image: fiap-videos-processor:latest
          ports:
            - containerPort: 3001
          envFrom:
            - secretRef:
                name: fiap-videos-secrets
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: '2'
              memory: 2Gi
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: fiap-videos-processor-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: fiap-videos-processor
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
