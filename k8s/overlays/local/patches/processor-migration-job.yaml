apiVersion: batch/v1
kind: Job
metadata:
  name: fiap-videos-processor-db-migration
spec:
  template:
    spec:
      containers:
        - name: migrate
          imagePullPolicy: IfNotPresent
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgres 5432; do
                echo "waiting for postgres..."
                sleep 2
              done
