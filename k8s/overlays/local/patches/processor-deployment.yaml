apiVersion: apps/v1
kind: Deployment
metadata:
  name: fiap-videos-processor
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: processor
          imagePullPolicy: IfNotPresent
      initContainers:
        - name: wait-for-deps
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgres 5432 && nc -z rabbitmq 5672 && nc -z minio 9000; do
                echo "waiting for postgres, rabbitmq, minio..."
                sleep 2
              done
