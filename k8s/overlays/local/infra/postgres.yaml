apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
data:
  01-init-dbs.sh: |
    #!/bin/bash
    set -e
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<-EOSQL
      SELECT 'CREATE DATABASE fiap_videos_api' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'fiap_videos_api')\gexec
      SELECT 'CREATE DATABASE fiap_videos_processor' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'fiap_videos_processor')\gexec
      SELECT 'CREATE DATABASE fiap_videos_notifier' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'fiap_videos_notifier')\gexec
    EOSQL

    for db in fiap_videos_api fiap_videos_processor fiap_videos_notifier; do
      psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$db" <<-EOSQL
        CREATE EXTENSION IF NOT EXISTS pgcrypto;
    EOSQL
    done
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: fiap
            - name: POSTGRES_PASSWORD
              value: fiap
            - name: POSTGRES_DB
              value: fiap_videos
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - fiap
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
        - name: init
          configMap:
            name: postgres-init
            defaultMode: 0755
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
