groups:
  - name: fiap-videos.rules
    rules:
      - alert: FiapVideosDatabaseDown
        expr: database_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Database unreachable ({{ $labels.job }})
          description: Prometheus scrape target reports database_up=0 for more than 1 minute.

      - alert: FiapVideosHighHttp5xxRate
        expr: |
          (
            sum by (job) (rate(http_requests_total{status_code=~"5.."}[5m]))
            /
            sum by (job) (rate(http_requests_total[5m]))
          ) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: High HTTP 5xx rate ({{ $labels.job }})
          description: More than 5% of HTTP requests returned 5xx in the last 5 minutes.
